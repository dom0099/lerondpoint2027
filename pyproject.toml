[project]
name = "chantier-c"
version = "0.1.0"
description = "Interface de vote sur-mesure — comptes participants, niveaux, badges, analyse red-dwarf"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "fastapi-users[sqlalchemy]>=14.0",
    "pwdlib[argon2]>=0.2",
    "aiosmtplib>=3.0",
    "itsdangerous>=2.2",
    "sqladmin>=0.20",
    "python-multipart>=0.0.9",
    # Version EXACTE, pas un plancher. Le calcul des groupes reprend à son compte
    # l'enchaînement réducteur → clusterer → stats du corps de
    # `reddwarf/implementations/base.py`, qui n'est pas une API documentée : une
    # montée de version peut le changer sans rien casser à l'import, et seuls les
    # bancs de `d0_mesures/` le verraient. Ne monter cette version que
    # délibérément, après les avoir rejoués — jamais par simple réinstallation.
    "red-dwarf==0.4.0",
    # Enveloppes concaves des groupes (chantier D4). Dépendance DIRECTE et non
    # l'extra `plots` de red-dwarf : cet extra tirerait aussi matplotlib et seaborn,
    # dont un serveur qui ne dessine rien n'a que faire. Épinglée pour la même raison
    # que red-dwarf — une roue cp312/manylinux existe, donc aucun compilateur C++ à
    # ajouter à l'image.
    "concave-hull==0.1.2",
    # Passe de PRODUCTION depuis le chantier K2 : le worker interroge les adresses
    # publiees pour savoir si elles repondent encore. Elle etait jusqu'ici une
    # dependance de developpement (les tests s'en servent comme client ASGI), et la
    # promouvoir impose une reconstruction d'image — les deploiements du chantier J
    # n'etaient qu'un redemarrage.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
